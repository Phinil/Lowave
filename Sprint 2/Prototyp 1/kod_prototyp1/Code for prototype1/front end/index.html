<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Small Web Music Finder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Upcoming Artists</h1>
    <p class="subtitle">Välj själv med filter eller skriv en prompt för att hitta små artister som passar dig.</p>

    <div class="form-box">
      <label for="genre">Genre</label>
      <select id="genre">
        <option value="indie">Indie</option>
        <option value="rock">Rock</option>
        <option value="house">House</option>
        <option value="pop">Pop</option>
        <option value="techno">Techno</option>
        <option value="ambient">Ambient</option>
        <option value="chill">Chill</option>
      </select>

      <label for="mood">Mood</label>
      <select id="mood">
        <option value="melankolisk">Melankolisk</option>
        <option value="glad">Glad</option>
        <option value="lugn">Lugn</option>
      </select>

      <label for="artistInput">Artist du gillar</label>
      <input
        id="artistInput"
        type="text"
        placeholder="t.ex. Phoebe Bridgers"
      >

      <label for="promptInput">Eller skriv en prompt</label>
      <textarea
        id="promptInput"
        rows="4"
        placeholder="t.ex. ge mig bra housemusik till min bilresa"
      ></textarea>

      <button id="searchButton">Hitta musik</button>
    </div>

    <div id="loading" class="hidden">
      <p>Vi tittar utanför boxen. Vi letar efter små artister som passar det du söker...</p>
    </div>

    <div id="results" class="results"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
